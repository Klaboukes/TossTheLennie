<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Lennie's face, filling the whole icon so it stays readable at tab size -->
  <g transform="translate(32 33) scale(1.42 1.40) translate(-32 -34)">
    <!-- face -->
    <ellipse cx="32" cy="34" rx="19.5" ry="22" fill="#f0bfa2"/>
    <!-- hair, receding at the temples -->
    <path d="M13 30C12 17 21 11 32 11s20 6 19 19c-3-6-6-8-9-7-3-4-17-4-20 0-3-1-6 1-9 7Z" fill="#3a281d"/>
    <!-- salt-and-pepper beard -->
    <path d="M12.8 38c1 12 9.5 19 19.2 19s18.2-7 19.2-19c-3 4-6.5 4-8.7 3-3-1-7-1-10.5-1S24 40 21.5 41c-2.2 1-5.7 1-8.7-3Z" fill="#6b5d55"/>
    <path d="M24 51c2 4 5 6 8 6s6-2 8-6c-3 1-5 1.5-8 1.5S27 52 24 51Z" fill="#9a8f88"/>
    <!-- big toothy smile -->
    <path d="M22 41c2 7 6 9 10 9s8-2 10-9c-6 1.5-14 1.5-20 0Z" fill="#3a1018"/>
    <path d="M23 41.3c6 1.3 12 1.3 18 0l-.6 2.6c-5.6 1-11.2 1-16.8 0Z" fill="#fbf7ee"/>
    <!-- dark rectangular glasses -->
    <rect x="15.5" y="26" width="13.5" height="9" rx="2.5" fill="#fff" stroke="#30343a" stroke-width="3"/>
    <rect x="35" y="26" width="13.5" height="9" rx="2.5" fill="#fff" stroke="#30343a" stroke-width="3"/>
    <path d="M29 29.5h6" stroke="#30343a" stroke-width="2.5"/>
    <circle cx="22.5" cy="31" r="2.4" fill="#1b1b22"/>
    <circle cx="41.5" cy="31" r="2.4" fill="#1b1b22"/>
  </g>
</svg>
