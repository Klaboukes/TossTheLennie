<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Lennie's head, tilted mid-toss, on the game's candy-coloured tile -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="rotate(-18 32 34)">
    <!-- ears -->
    <ellipse cx="13" cy="34" rx="4" ry="6" fill="#e8ad8e"/>
    <ellipse cx="51" cy="34" rx="4" ry="6" fill="#e8ad8e"/>
    <!-- face -->
    <ellipse cx="32" cy="34" rx="19" ry="22" fill="#f0bfa2"/>
    <!-- hair, receding at the temples -->
    <path d="M14 30C13 17 21 11 32 11s19 6 18 19c-3-6-6-8-9-7-3-4-15-4-18 0-3-1-6 1-9 7Z" fill="#3a281d"/>
    <!-- salt-and-pepper beard -->
    <path d="M13.5 38c1 12 9 19 18.5 19s17.5-7 18.5-19c-3 4-6 4-8 3-3-1-7-1-10.5-1S24 40 21.5 41c-2 1-5 1-8-3Z" fill="#6b5d55"/>
    <path d="M24 51c2 4 5 6 8 6s6-2 8-6c-3 1-5 1.5-8 1.5S27 52 24 51Z" fill="#9a8f88"/>
    <!-- big toothy smile -->
    <path d="M22 41c2 7 6 9 10 9s8-2 10-9c-6 1.5-14 1.5-20 0Z" fill="#3a1018"/>
    <path d="M23 41.3c6 1.3 12 1.3 18 0l-.6 2.6c-5.6 1-11.2 1-16.8 0Z" fill="#fbf7ee"/>
    <!-- dark rectangular glasses -->
    <rect x="16" y="26" width="13" height="9" rx="2.5" fill="#fff" stroke="#30343a" stroke-width="3"/>
    <rect x="35" y="26" width="13" height="9" rx="2.5" fill="#fff" stroke="#30343a" stroke-width="3"/>
    <path d="M29 29.5h6" stroke="#30343a" stroke-width="2.5"/>
    <circle cx="23" cy="31" r="2.3" fill="#1b1b22"/>
    <circle cx="41" cy="31" r="2.3" fill="#1b1b22"/>
  </g>
</svg>
